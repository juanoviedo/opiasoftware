<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Acceso · OPIA Admin</title>
    <style>
      :root {
        --navy: #071e3d;
        --navy-2: #0b2b50;
        --blue: #087ef5;
        --sky: #15b8f4;
        --muted: #8fa6bd;
        --line: rgba(255, 255, 255, 0.1);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
        background:
          radial-gradient(1100px 600px at 15% -10%, #123a68 0%, transparent 60%),
          radial-gradient(900px 500px at 110% 110%, #0a4f7a 0%, transparent 55%),
          var(--navy);
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px 28px;
        backdrop-filter: blur(8px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      }
      .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
      .brand b { font-family: Montserrat, Inter, sans-serif; font-size: 22px; letter-spacing: 0.06em; }
      .brand span { font-size: 11px; letter-spacing: 0.22em; color: var(--sky); text-transform: uppercase; }
      p.sub { margin: 0 0 26px; color: var(--muted); font-size: 14px; line-height: 1.5; }
      label { display: block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(4, 16, 32, 0.6);
        color: #fff;
        font-size: 15px;
        font-family: inherit;
        margin-bottom: 18px;
      }
      input:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: transparent; }
      button {
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--blue), var(--sky));
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: progress; }
      .err {
        display: none;
        margin: 0 0 16px;
        padding: 11px 13px;
        border-radius: 10px;
        background: rgba(255, 90, 90, 0.12);
        border: 1px solid rgba(255, 90, 90, 0.35);
        color: #ffd7d7;
        font-size: 13.5px;
        line-height: 1.45;
      }
      .err[data-show="1"] { display: block; }
      .foot { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.5; }
      code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
    </style>
  </head>
  <body>
    <form class="card" id="loginForm" autocomplete="on" novalidate>
      <div class="brand"><b>OPIA</b><span>Admin</span></div>
      <p class="sub">Panel de tráfico y leads de opiasoftware.com</p>

      <div class="err" id="error" role="alert"></div>

      <label for="user">Usuario</label>
      <input id="user" name="user" type="text" value="opia" autocomplete="username" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit" id="submit">Entrar</button>

      <p class="foot">
        ¿Primera vez? Define la contraseña en el servidor con<br />
        <code>node server/scripts/set-password.js</code>
      </p>
    </form>

    <script>
      (function () {
        var form = document.getElementById('loginForm');
        var errorBox = document.getElementById('error');
        var submit = document.getElementById('submit');

        function showError(message) {
          errorBox.textContent = message;
          errorBox.setAttribute('data-show', '1');
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          errorBox.removeAttribute('data-show');
          submit.disabled = true;
          submit.textContent = 'Verificando…';

          fetch('/opadmin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              user: document.getElementById('user').value,
              password: document.getElementById('password').value,
            }),
          })
            .then(function (res) {
              return res.json().catch(function () {
                return { ok: false, error: 'Respuesta inválida del servidor.' };
              });
            })
            .then(function (data) {
              if (data && data.ok) {
                window.location.href = '/opadmin';
                return;
              }
              showError((data && data.error) || 'No fue posible iniciar sesión.');
              submit.disabled = false;
              submit.textContent = 'Entrar';
            })
            .catch(function () {
              showError('Sin conexión con el servidor.');
              submit.disabled = false;
              submit.textContent = 'Entrar';
            });
        });
      })();
    </script>
  </body>
</html>
