name: opiasoftware-home

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8160:3000"
    environment:
      OPIA_TRUST_PROXY: "1"
      OPIA_PUBLIC_URL: https://opiasoftware.com
    volumes:
      - ./server/data:/app/server/data
      # Almacén propio de Haztek: separado del de OPIA para poder exportar
      # el proyecto a otro contenedor sin arrastrar datos de este sitio.
      - ./haztek/data:/app/haztek/data
