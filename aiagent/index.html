<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Asistente virtual · OPIA Software</title>
    <style>
      :root {
        --navy: #071e3d;
        --navy-2: #0b2b50;
        --blue: #087ef5;
        --sky: #15b8f4;
        --text: #eaf2fa;
        --muted: #8fa6bd;
        --line: rgba(255, 255, 255, 0.09);
        --burbuja-ia: rgba(255, 255, 255, 0.08);
        --burbuja-usuario: #087ef5;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 700px at 10% -15%, #10355e 0%, transparent 60%),
          radial-gradient(900px 600px at 105% 5%, #0a4a72 0%, transparent 55%),
          var(--navy);
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      a { color: var(--sky); }

      header.barra {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px; border-bottom: 1px solid var(--line);
        background: rgba(4, 14, 28, 0.55);
      }
      .marca { display: flex; align-items: baseline; gap: 8px; }
      .marca b { font-size: 20px; letter-spacing: 0.06em; }
      .marca span { font-size: 11px; letter-spacing: 0.22em; color: var(--sky); text-transform: uppercase; }
      .estado { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
      .estado::before {
        content: ''; width: 8px; height: 8px; border-radius: 50%;
        background: #2ecc8f; display: inline-block;
      }
      .espacio { flex: 1; }
      button {
        font-family: inherit; cursor: pointer;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 9px; padding: 8px 13px; font-size: 13px; min-height: 36px;
      }
      button:hover { background: rgba(255, 255, 255, 0.12); }
      button[disabled] { opacity: 0.45; cursor: not-allowed; }

      #chat {
        flex: 1; overflow-y: auto;
        padding: 18px 14px 8px;
        display: flex; flex-direction: column; gap: 10px;
        max-width: 760px; width: 100%; margin: 0 auto;
      }
      .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
      .msg.ia { align-self: flex-start; background: var(--burbuja-ia); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
      .msg.usuario { align-self: flex-end; background: var(--burbuja-usuario); color: #fff; border-bottom-right-radius: 4px; }
      .msg.aviso { align-self: center; background: rgba(255, 176, 32, 0.12); border: 1px solid rgba(255, 176, 32, 0.35); color: #ffd37f; font-size: 12.5px; max-width: 92%; text-align: center; }
      .msg.escribiendo { color: var(--muted); font-style: italic; }

      form#formulario {
        border-top: 1px solid var(--line);
        background: rgba(4, 14, 28, 0.55);
        padding: 10px 14px 14px;
      }
      .caja-envio { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
      .caja-envio input {
        flex: 1; padding: 12px 14px; border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(4, 16, 32, 0.6);
        color: #fff; font-size: 16px; font-family: inherit;
      }
      .caja-envio input:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: transparent; }
      .caja-envio button { background: var(--blue); border-color: transparent; color: #fff; font-weight: 600; padding: 12px 20px; border-radius: 12px; }
      .caja-envio button:hover { background: #2b90ff; }
      .privacidad { max-width: 760px; margin: 8px auto 0; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header class="barra">
      <div class="marca"><b>OPIA</b><span>Asistente virtual</span></div>
      <div class="estado">En línea</div>
      <div class="espacio"></div>
      <button id="btn-copiar" type="button" hidden>Copiar enlace de esta conversación</button>
    </header>

    <main id="chat" aria-live="polite"></main>

    <form id="formulario" autocomplete="off">
      <div class="caja-envio">
        <input id="entrada" type="text" placeholder="Escribe tu mensaje…" maxlength="2000" required />
        <button id="btn-enviar" type="submit">Enviar</button>
      </div>
      <p class="privacidad">
        Al conversar, tus datos (nombre, celular y lo que nos cuentes) quedan registrados en nuestro sistema
        para darte seguimiento comercial, según nuestra
        <a href="/privacidad" target="_blank" rel="noopener">política de tratamiento de datos</a>.
      </p>
    </form>

    <script>
    'use strict';

    const chat = document.querySelector('#chat');
    const entrada = document.querySelector('#entrada');
    const btnEnviar = document.querySelector('#btn-enviar');
    const btnCopiar = document.querySelector('#btn-copiar');

    // /aiagent/<guid> carga esa conversación; /aiagent limpio empieza de cero
    // (el servidor ya redirigió si había cookie de una conversación previa).
    // Al abrir la página se crea de una vez la sesión y el contacto en blanco
    // ("Esperando respuesta agente IA"); el guid pendiente vive en sessionStorage
    // para que un F5 antes de registrarse no cree un contacto nuevo.
    const partes = location.pathname.split('/').filter(Boolean);
    const guidUrl = partes.length === 2 ? partes[1] : '';
    let guid = guidUrl;
    const CLAVE_PENDIENTE = 'aiagent:guid';

    function burbuja(texto, quien) {
      const div = document.createElement('div');
      div.className = 'msg ' + quien;
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function aviso(texto) {
      const div = document.createElement('div');
      div.className = 'msg aviso';
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function api(ruta, opciones = {}) {
      const resp = await fetch(ruta, {
        headers: opciones.body ? { 'Content-Type': 'application/json' } : undefined,
        ...opciones,
      });
      let datos = {};
      try { datos = await resp.json(); } catch { /* sin cuerpo */ }
      return { status: resp.status, ...datos };
    }

    async function prepararSesion() {
      const pendiente = sessionStorage.getItem(CLAVE_PENDIENTE) || '';
      const r = await api('/api/aiagent/inicio', {
        method: 'POST',
        body: JSON.stringify({ guid: guid || pendiente || undefined }),
      });
      if (!r.ok) return;
      guid = r.guid;
      sessionStorage.setItem(CLAVE_PENDIENTE, guid);
    }

    async function cargarHistorial() {
      if (!guid) return;
      const r = await api('/api/aiagent/sesion?guid=' + encodeURIComponent(guid));
      if (r.ok) {
        for (const m of r.historial) burbuja(m.texto, m.rol === 'usuario' ? 'usuario' : 'ia');
      } else {
        await prepararSesion(); // guid de la URL sin sesión: se materializa
      }
      btnCopiar.hidden = false;
    }

    async function arranque() {
      if (guid) await cargarHistorial();
      else await prepararSesion();
      entrada.focus();
    }

    async function enviar(texto) {
      btnEnviar.disabled = true;
      entrada.disabled = true;
      const esperando = burbuja('Escribiendo…', 'ia escribiendo');
      try {
        const r = await api('/api/aiagent/mensaje', {
          method: 'POST',
          body: JSON.stringify({ guid: guid || undefined, texto }),
        });
        esperando.remove();
        if (!r.ok) {
          aviso(r.error || 'No pude responder. Intenta de nuevo.');
          return;
        }
        guid = r.guid;
        sessionStorage.setItem(CLAVE_PENDIENTE, guid);
        btnCopiar.hidden = false;
        burbuja(r.respuesta, 'ia');
        // al registrarse el lead, la página se recarga con su enlace propio:
        // entra la cookie de continuidad y la conversación queda conservada
        if (r.lead && !guidUrl) {
          location.replace('/aiagent/' + encodeURIComponent(guid));
        }
      } catch {
        esperando.remove();
        aviso('Falló la conexión. Intenta de nuevo.');
      } finally {
        btnEnviar.disabled = false;
        entrada.disabled = false;
        entrada.focus();
      }
    }

    document.querySelector('#formulario').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const texto = entrada.value.trim();
      if (!texto) return;
      entrada.value = '';
      burbuja(texto, 'usuario');
      enviar(texto);
    });

    btnCopiar.addEventListener('click', async () => {
      if (!guid) return;
      const enlace = location.origin + '/aiagent/' + guid;
      try {
        await navigator.clipboard.writeText(enlace);
        btnCopiar.textContent = '¡Enlace copiado!';
      } catch {
        window.prompt('Copia el enlace de esta conversación:', enlace);
      }
      setTimeout(() => { btnCopiar.textContent = 'Copiar enlace de esta conversación'; }, 1500);
    });

    arranque();
    </script>
  </body>
</html>
