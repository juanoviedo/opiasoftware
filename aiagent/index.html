<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Asistente virtual · OPIA Software</title>
    <style>
      :root {
        --navy: #071e3d;
        --navy-2: #0b2b50;
        --blue: #087ef5;
        --sky: #15b8f4;
        --text: #eaf2fa;
        --muted: #8fa6bd;
        --line: rgba(255, 255, 255, 0.09);
        --burbuja-ia: rgba(255, 255, 255, 0.08);
        --burbuja-usuario: #087ef5;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 700px at 10% -15%, #10355e 0%, transparent 60%),
          radial-gradient(900px 600px at 105% 5%, #0a4a72 0%, transparent 55%),
          var(--navy);
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      a { color: var(--sky); }

      header.barra {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px; border-bottom: 1px solid var(--line);
        background: rgba(4, 14, 28, 0.55);
      }
      .marca { display: flex; align-items: baseline; gap: 8px; }
      .marca b { font-size: 20px; letter-spacing: 0.06em; }
      .marca span { font-size: 11px; letter-spacing: 0.22em; color: var(--sky); text-transform: uppercase; }
      .estado { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
      .estado::before {
        content: ''; width: 8px; height: 8px; border-radius: 50%;
        background: #2ecc8f; display: inline-block;
      }
      .espacio { flex: 1; }
      button {
        font-family: inherit; cursor: pointer;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 9px; padding: 8px 13px; font-size: 13px; min-height: 36px;
      }
      button:hover { background: rgba(255, 255, 255, 0.12); }
      button[disabled] { opacity: 0.45; cursor: not-allowed; }

      #chat {
        flex: 1; overflow-y: auto;
        padding: 18px 14px 8px;
        display: flex; flex-direction: column; gap: 10px;
        max-width: 760px; width: 100%; margin: 0 auto;
      }
      .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
      .msg.ia { align-self: flex-start; background: var(--burbuja-ia); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
      .msg.usuario { align-self: flex-end; background: var(--burbuja-usuario); color: #fff; border-bottom-right-radius: 4px; }
      .msg.aviso { align-self: center; background: rgba(255, 176, 32, 0.12); border: 1px solid rgba(255, 176, 32, 0.35); color: #ffd37f; font-size: 12.5px; max-width: 92%; text-align: center; }
      .msg.escribiendo { color: var(--muted); font-style: italic; }

      /* los dos botones de cómo empezar: aparecen bajo el saludo mientras
         la persona no haya escrito su primer mensaje */
      #eleccion { display: flex; flex-direction: column; gap: 8px; max-width: 82%; width: 100%; }
      #eleccion .opcion {
        text-align: left; background: rgba(8, 126, 245, 0.12);
        border: 1px solid rgba(21, 184, 244, 0.5); border-radius: 14px;
        border-bottom-left-radius: 4px; padding: 11px 16px;
        font-size: 14.5px; line-height: 1.4; white-space: normal;
      }
      #eleccion .opcion:hover { background: rgba(8, 126, 245, 0.25); }

      form#formulario {
        border-top: 1px solid var(--line);
        background: rgba(4, 14, 28, 0.55);
        padding: 10px 14px 14px;
      }
      .caja-envio { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
      .caja-envio input {
        flex: 1; padding: 12px 14px; border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(4, 16, 32, 0.6);
        color: #fff; font-size: 16px; font-family: inherit;
      }
      .caja-envio input:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: transparent; }
      .caja-envio button { background: var(--blue); border-color: transparent; color: #fff; font-weight: 600; padding: 12px 20px; border-radius: 12px; white-space: nowrap; }
      .caja-envio button:hover { background: #2b90ff; }
      .privacidad { max-width: 760px; margin: 8px auto 0; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header class="barra">
      <div class="marca"><b>OPIA</b><span>Asistente virtual</span></div>
      <div class="estado">En línea</div>
    </header>

    <main id="chat" aria-live="polite"></main>

    <div id="eleccion" hidden>
      <button type="button" class="opcion">Prefiero una reunión por Teams</button>
      <button type="button" class="opcion">Prefiero conversar con el asistente</button>
    </div>

    <form id="formulario" autocomplete="off">
      <div class="caja-envio">
        <input id="entrada" type="email" placeholder="tu@correo.com" maxlength="160" required />
        <button id="btn-enviar" type="submit">Enviar enlace</button>
      </div>
      <p class="privacidad">
        Al conversar, tus datos (nombre, celular y lo que nos cuentes) quedan registrados en nuestro sistema
        para darte seguimiento comercial, según nuestra
        <a href="/privacidad" target="_blank" rel="noopener">política de tratamiento de datos</a>.
      </p>
    </form>

    <script>
    'use strict';

    const chat = document.querySelector('#chat');
    const entrada = document.querySelector('#entrada');
    const btnEnviar = document.querySelector('#btn-enviar');
    const eleccion = document.querySelector('#eleccion');

    // /aiagent/<guid> entra desde el enlace del correo (la sesión ya quedó
    // autenticada); /aiagent limpio pide el correo para mandar el magic link.
    const partes = location.pathname.split('/').filter(Boolean);
    const guidUrl = partes.length === 2 ? partes[1] : '';
    let guid = guidUrl;
    let modo = 'correo'; // 'correo' → espera el correo | 'chat' → conversación
    // mensajes ya escritos por el usuario en el historial visible: mientras
    // esté en 0 (solo el saludo) se ofrecen los dos botones de cómo empezar
    let mensajesUsuario = 0;

    function alFondo() { chat.scrollTop = chat.scrollHeight; }

    function ocultarEleccion() { eleccion.hidden = true; }

    function mostrarEleccion() {
      if (modo !== 'chat' || mensajesUsuario > 0 || eleccion.hidden === false) return;
      chat.appendChild(eleccion); // al final del hilo, debajo del saludo
      eleccion.hidden = false;
      alFondo();
    }

    eleccion.addEventListener('click', (ev) => {
      const boton = ev.target.closest('.opcion');
      if (!boton || btnEnviar.disabled) return;
      const texto = boton.textContent.trim();
      ocultarEleccion();
      mensajesUsuario += 1;
      burbuja(texto, 'usuario');
      enviar(texto);
    });

    function burbuja(texto, quien) {
      const div = document.createElement('div');
      div.className = 'msg ' + quien;
      div.textContent = texto;
      chat.appendChild(div);
      alFondo();
      return div;
    }

    function aviso(texto) {
      const div = document.createElement('div');
      div.className = 'msg aviso';
      div.textContent = texto;
      chat.appendChild(div);
      alFondo();
    }

    // burbuja con enlace dentro (texto plano + <a>), para el aviso de privacidad
    function burbujaConEnlace(frases, quien) {
      const div = document.createElement('div');
      div.className = 'msg ' + quien;
      for (const parte of frases) {
        if (typeof parte === 'string') div.appendChild(document.createTextNode(parte));
        else div.appendChild(parte);
      }
      chat.appendChild(div);
      alFondo();
      return div;
    }

    async function api(ruta, opciones = {}) {
      const resp = await fetch(ruta, {
        headers: opciones.body ? { 'Content-Type': 'application/json' } : undefined,
        ...opciones,
      });
      let datos = {};
      try { datos = await resp.json(); } catch { /* sin cuerpo */ }
      return { status: resp.status, ...datos };
    }

    function pantallaCorreo() {
      modo = 'correo';
      ocultarEleccion();
      entrada.type = 'email';
      entrada.placeholder = 'tu@correo.com';
      btnEnviar.textContent = 'Enviar enlace';
      entrada.focus();

      const enlace = document.createElement('a');
      enlace.href = '/privacidad';
      enlace.target = '_blank';
      enlace.rel = 'noopener';
      enlace.textContent = 'Políticas de Privacidad y Términos';
      burbujaConEnlace([
        '¡Hola! 👋 Qué gusto saludarte. Para poder brindarte una atención personalizada y asegurarnos de que ' +
          'siempre tengas acceso a tu historial de conversación, por favor compártenos tu correo electrónico. ' +
          '(Te enviaremos un enlace seguro de acceso directo. Al continuar, aceptas nuestras ',
        enlace,
        '.)',
      ], 'ia');
    }

    function pantallaChat() {
      modo = 'chat';
      entrada.type = 'text';
      entrada.placeholder = 'Escribe tu mensaje…';
      btnEnviar.textContent = 'Enviar';
      entrada.focus();
    }

    async function cargarHistorial() {
      const r = await api('/api/aiagent/sesion?guid=' + encodeURIComponent(guid));
      if (!r.ok) return false;
      for (const m of r.historial) burbuja(m.texto, m.rol === 'usuario' ? 'usuario' : 'ia');
      mensajesUsuario = r.historial.filter((m) => m.rol === 'usuario').length;
      pantallaChat();
      mostrarEleccion();
      return true;
    }

    async function arranque() {
      if (new URLSearchParams(location.search).get('enlace') === 'invalido') {
        aviso('Ese enlace venció o ya se usó. Escribe tu correo para recibir uno nuevo.');
      }
      if (guid && (await cargarHistorial())) return;
      if (guid) aviso('No encontramos esa conversación. Escribe tu correo para continuar donde quedaste.');
      pantallaCorreo();
    }

    async function pedirEnlace(correo) {
      btnEnviar.disabled = true;
      entrada.disabled = true;
      burbuja(correo, 'usuario');
      try {
        const r = await api('/api/aiagent/email', {
          method: 'POST',
          body: JSON.stringify({ correo }),
        });
        if (!r.ok) {
          aviso(r.error || 'No pudimos enviar el correo. Intenta de nuevo.');
          return;
        }
        burbuja('¡Listo! Te acabamos de enviar un enlace seguro de acceso directo a ' + correo + '. Revisa tu bandeja para continuar.', 'ia');
        btnEnviar.textContent = 'Reenviar enlace';
      } catch {
        aviso('Falló la conexión. Intenta de nuevo.');
      } finally {
        btnEnviar.disabled = false;
        entrada.disabled = false;
        entrada.focus();
      }
    }

    async function enviar(texto) {
      btnEnviar.disabled = true;
      entrada.disabled = true;
      const esperando = burbuja('Escribiendo…', 'ia escribiendo');
      try {
        const r = await api('/api/aiagent/mensaje', {
          method: 'POST',
          body: JSON.stringify({ guid, texto }),
        });
        esperando.remove();
        if (!r.ok) {
          if (r.status === 404) {
            aviso(r.error || 'Conversación no encontrada.');
            pantallaCorreo();
            return;
          }
          aviso(r.error || 'No pude responder. Intenta de nuevo.');
          return;
        }
        guid = r.guid;
        burbuja(r.respuesta, 'ia');
      } catch {
        esperando.remove();
        aviso('Falló la conexión. Intenta de nuevo.');
      } finally {
        btnEnviar.disabled = false;
        entrada.disabled = false;
        entrada.focus();
      }
    }

    document.querySelector('#formulario').addEventListener('submit', (ev) => {
      ev.preventDefault();
      if (modo === 'correo') {
        const correo = entrada.value.trim();
        if (!correo) return;
        entrada.value = '';
        pedirEnlace(correo);
        return;
      }
      const texto = entrada.value.trim();
      if (!texto) return;
      entrada.value = '';
      mensajesUsuario += 1;
      ocultarEleccion();
      burbuja(texto, 'usuario');
      enviar(texto);
    });

    arranque();
    </script>
  </body>
</html>
